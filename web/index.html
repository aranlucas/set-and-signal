<!doctype html>
<html lang="en" data-accent="violet">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#f6f7fb" />
    <script>
      try {
        const state = JSON.parse(localStorage.getItem("gym_state_v1") || "null");
        const isDark = state?.theme === "dark";
        document.documentElement.classList.toggle("dark", isDark);
        if (typeof state?.accent === "string") {
          document.documentElement.dataset.accent = state.accent;
        }
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", isDark ? "#131521" : "#f6f7fb");
      } catch {
        document.documentElement.classList.remove("dark");
      }
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Set &amp; Signal — your training, in focus</title>
    <meta
      name="description"
      content="Plan your training, log every set, and see your progress. Your personal strength training workspace."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Set &amp; Signal" />
    <link rel="preload" href="fonts/manrope-regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" type="image/png" href="icon-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
